name: radar
on:
  schedule:
    - cron: '0 7,16 * * *'   # 09:00 e 18:00 CET (ciclo)
    - cron: '0 18 * * 0'     # domingo 20:00 CET (digest semanal)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node src/index.js ${{ github.event.schedule == '0 18 * * 0' && '--digest' || '--ciclo' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # O digest gera reports/*.md; comita de volta no repo.
      - name: commit do digest
        if: github.event.schedule == '0 18 * * 0'
        run: |
          git config user.name "radar-bot"
          git config user.email "radar@users.noreply.github.com"
          git add reports/
          git commit -m "digest semanal" || echo "sem mudanças"
          git push || echo "push falhou"
